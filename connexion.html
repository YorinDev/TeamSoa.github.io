<body>

<header>

<nav>

<div id="account-container"></div>

</div>

</nav>

</header>

<main class="auth-page">

<div class="auth-container">

<div class="auth-logo">

<img src="images/SOA_logo_gris.jpg" alt="SOA Logo">

<h1>SOA ESPORT</h1>

<p>Connexion à votre compte</p>

</div>

<div class="tabs">

<button id="loginTab" class="active">

Connexion

</button>

<button id="registerTab">

Inscription

</button>

</div>

<!-- CONNEXION -->

<form id="loginForm" class="auth-form">

<div class="input-group">

<label>Adresse e-mail</label>

<input
type="email"
id="loginEmail"
placeholder="exemple@email.com"
required>

</div>

<div class="input-group">

<label>Mot de passe</label>

<input
type="password"
id="loginPassword"
placeholder="********"
required>

</div>

<button
type="submit"
class="auth-button">

Se connecter

</button>

<p class="forgot">

<a href="#" id="forgotPassword">

Mot de passe oublié ?

</a>

</p>

</form>

<!-- INSCRIPTION -->

<form
id="registerForm"
class="auth-form hidden">

<div class="input-group">

<label>Pseudo</label>

<input
type="text"
id="registerUsername"
placeholder="Votre pseudo"
required>

</div>

<div class="input-group">

<label>Adresse e-mail</label>

<input
type="email"
id="registerEmail"
placeholder="exemple@email.com"
required>

</div>

<div class="input-group">

<label>Mot de passe</label>

<input
type="password"
id="registerPassword"
placeholder="********"
required>

</div>

<div class="input-group">

<label>Confirmer le mot de passe</label>

<input
type="password"
id="registerConfirm"
placeholder="********"
required>

</div>

<button
type="submit"
class="auth-button">

Créer mon compte

</button>

</form>

<div
id="authMessage"
class="auth-message">

</div>

</div>

</main>

<footer>

<img src="images/SOA_logo_gris.jpg" alt="Logo SOA">

<h3>SOA ESPORT</h3>

<p>

© 2026 SOA Esport - Tous droits réservés.

</p>

</footer>
