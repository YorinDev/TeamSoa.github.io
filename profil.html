<main class="profile-page">


<section class="profile-card">





<div class="avatar-container">


<img
id="profileAvatar"
src="images/default-avatar.png"
alt="Avatar"
class="profile-avatar">



<div class="avatar-edit">

✏️

</div>


</div>








<div class="username-container">


<h1 id="profileUsername">

Utilisateur

</h1>



<button id="editUsernameButton">

✏️

</button>



</div>






<p id="profileEmail">

email

</p>








<div class="profile-info">



<div>

<span>
Rôle
</span>


<strong id="profileRole">

Member

</strong>


</div>





<div>

<span>
Compte vérifié
</span>


<strong id="profileVerified">

Oui

</strong>


</div>





<div>

<span>
Date d'inscription
</span>


<strong id="profileDate">

-

</strong>


</div>



</div>









<button
id="logoutButton"
class="profile-button">


Déconnexion


</button>






</section>


</main>









<!-- MODIFICATION PSEUDO -->


<div class="modal" id="usernameModal">


<div class="modal-content">


<h2>

Modifier le pseudo

</h2>



<input
id="newUsername"
type="text"
placeholder="Nouveau pseudo">





<button id="cancelUsername">

Annuler

</button>



<button id="saveUsername">

Sauvegarder

</button>



</div>


</div>









<!-- MODIFICATION AVATAR -->


<div class="modal" id="avatarModal">


<div class="modal-content">


<h2>

Modifier la photo

</h2>





<input
type="file"
id="avatarInput"
accept="image/*">





<div class="crop-area">


<img
id="avatarPreview">


</div>






<button id="cancelAvatar">

Annuler

</button>



<button id="saveAvatar">

Sauvegarder

</button>




</div>


</div>
