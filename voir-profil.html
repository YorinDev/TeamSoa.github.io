<style>


/* ==========================
        PAGE PROFIL
========================== */


.profile-page{

    padding-top:160px;

    display:flex;

    justify-content:center;

    min-height:80vh;

    padding-left:20px;

    padding-right:20px;

}




/* ==========================
        CARTE
========================== */


.profile-card{


    width:400px;

    max-width:100%;


    background:rgba(255,122,0,.05);


    border:1px solid rgba(255,122,0,.25);


    border-radius:25px;


    padding:40px;


    text-align:center;


    box-shadow:
    0 0 30px rgba(255,122,0,.15);



    animation:

    profileAppear .6s ease;


}





@keyframes profileAppear{


    from{

        opacity:0;

        transform:
        translateY(30px);

    }


    to{

        opacity:1;

        transform:
        translateY(0);

    }


}







/* ==========================
        AVATAR
========================== */


.profile-card img{


    width:150px;

    height:150px;


    border-radius:50%;


    object-fit:cover;


    border:3px solid #FF7A00;


    transition:.3s;


}




.profile-card img:hover{


    transform:scale(1.05);


}






/* ==========================
        PSEUDO
========================== */


.profile-card h1{


    color:#FF7A00;


    margin-top:25px;


    font-size:32px;


    word-break:break-word;


}






/* ==========================
        INFORMATIONS
========================== */


.profile-info{


    margin-top:30px;


    text-align:left;


}




.info{


    margin-bottom:15px;


    color:#C9CED6;


    font-size:16px;


}




.info span{


    color:white;


    font-weight:bold;


}




.role{


    font-weight:bold;


}







/* ==========================
        RETOUR
========================== */


.back{


    margin-top:30px;


}




.back a{


    color:#FF7A00;


    text-decoration:none;


    transition:.3s;


}




.back a:hover{


    color:#FFA33A;


}







/* ==========================
        MOBILE
========================== */


@media(max-width:500px){



.profile-card{


    padding:25px;


}



.profile-card img{


    width:120px;

    height:120px;


}



.profile-card h1{


    font-size:26px;


}



}






</style>


</head>
